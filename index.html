<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>משחק זיכרון חנוכה</title>

<!-- PWA: מניפסט ואייקונים -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<!-- אייפון/אייפד: האייקון שיופיע על מסך הבית -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="זיכרון חנוכה">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="זיכרון חנוכה">
<meta name="description" content="משחק זיכרון שמח לחנוכה לילדים">

<!-- גופן מעוגל עם תמיכה בעברית. בלי אינטרנט – נופל בעדינות לגופן מערכת -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   משחק זיכרון חנוכה – עיצוב
   דף לבן, ירוק להצלחה, כחול לפעולות, קלפים וכפתורים "מדבקה".
   עדיפות עליונה: קלפים גדולים ככל האפשר, בקרים קומפקטיים.
   ========================================================= */
:root {
  --green: #58cc02;
  --green-dark: #58a700;
  --green-wash: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --gold: #ffc800;
  --paper: #ffffff;
  --ink: #4b4b4b;
  --pencil: #777777;
  --line: #e5e5e5;

  /* מידות קלף – מחושבות ב-JS לפי המסך */
  --cw: 80px;     /* רוחב */
  --ch: 100px;    /* גובה */
  --cs: 80px;     /* הצלע הקטנה – בסיס לגדלי טקסט */
  --lift: 4px;    /* עובי "התחתית" התלת-ממדית */
  --gap: 8px;

  --font: "Rubik", "Varela Round", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font);
  font-weight: 500;
  color: var(--ink);
  background: var(--paper);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 1400px;
  margin: 0 auto;
  padding:
    max(6px, env(safe-area-inset-top))
    max(8px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(8px, env(safe-area-inset-left));
}

/* ---------- סרגל עליון קומפקטי (שורה אחת) ---------- */
header {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand .logo { width: 34px; height: 34px; animation: wobble 3s ease-in-out infinite; transform-origin: 50% 90%; }
h1 {
  display: none;                 /* מוצג רק במסכים רחבים */
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--green);
  letter-spacing: -0.02em;
  white-space: nowrap;
}

/* בורר רמות – "פיל" אחד מחולק לשלושה */
.levels {
  flex: 1;
  display: flex;
  gap: 4px;
  padding: 3px;
  background: #f2f2f2;
  border: 2px solid var(--line);
  border-radius: 14px;
  max-width: 460px;
  margin-inline: auto;
}
.level-btn {
  flex: 1;
  font: inherit;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--pencil);
  background: transparent;
  border: none;
  border-radius: 10px;
  min-height: 40px;
  padding: 2px 6px;
  cursor: pointer;
  touch-action: manipulation;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  white-space: nowrap;
  transition: background .15s, color .15s, transform .08s;
}
.level-btn .ico { font-size: 1.1em; line-height: 1; }
.level-btn.active {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 3px 0 var(--blue-dark);
}
.level-btn:active { transform: translateY(2px); }

/* כפתור אייקון קטן */
.icon-btn {
  flex-shrink: 0;
  width: 44px; height: 44px;
  font-size: 1.3rem;
  display: grid; place-items: center;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--line);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }

/* ---------- פס התקדמות דק ---------- */
.progress-row { display: flex; align-items: center; gap: 8px; padding: 8px 2px 8px; }
.progress { flex: 1; height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress .fill {
  height: 100%; width: 0%;
  background: var(--green);
  border-radius: 999px;
  position: relative;
  transition: width .6s cubic-bezier(.3,1.4,.5,1);
}
.progress .fill::after {
  content: ""; position: absolute;
  top: 3px; right: 6px; left: 6px; height: 3px;
  border-radius: 999px; background: rgba(255,255,255,.4);
}
.progress-count {
  font-weight: 800; font-size: .95rem; color: var(--green);
  min-width: 2.8em; text-align: center; direction: ltr;
}

/* ---------- לוח הקלפים – מקבל את כל השטח שנשאר ---------- */
.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { display: grid; gap: var(--gap); justify-content: center; align-content: center; }

.card {
  width: var(--cw);
  height: var(--ch);
  perspective: 900px;
  border: none; background: none; padding: 0;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s;
}
.card:not(.matched):not(.flipped):active { transform: translateY(3px); }
.card:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 12px; }

.inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.4,.2,.2,1);
}
.card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0 0 var(--lift) 0;     /* מקום ל"תחתית" המדבקה */
  border-radius: calc(var(--cs) * .16);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 2px solid;
}

/* גב הקלף – כחול שטוח עם מגן דוד לבן */
.back {
  background: var(--blue);
  border-color: var(--blue-dark);
  box-shadow: 0 var(--lift) 0 var(--blue-dark);
  display: grid; place-items: center;
}
.back::before {
  content: ""; position: absolute; inset: 8%;
  border: 2px dashed rgba(255,255,255,.45);
  border-radius: calc(var(--cs) * .1);
}
.back svg { width: calc(var(--cs) * .5); height: calc(var(--cs) * .5); }

/* פני הקלף */
.front {
  transform: rotateY(180deg);
  background: var(--paper);
  border-color: var(--line);
  box-shadow: 0 var(--lift) 0 var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 5% 4% 4%;
  transition: background .3s, border-color .3s, box-shadow .3s;
}
.front .art { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; }
.front .art svg { width: 100%; height: 100%; max-width: calc(var(--cs) * .82); }
.front .name {
  color: var(--ink);
  font-weight: 700;
  font-size: calc(var(--cs) * .17);
  line-height: 1.15;
  white-space: nowrap;
}
.front .name.long { font-size: calc(var(--cs) * .13); }
.front .name .first { color: var(--blue); }

/* ברמת "אות פותחת" השם מוסתר עד שמוצאים זוג – ואז מוצג עם האות מודגשת */
.front .name.hide-until-match { visibility: hidden; }
.card.matched .front .name.hide-until-match { visibility: visible; }

/* קלף אות */
.front .letter {
  flex: 1;
  display: grid; place-items: center;
  font-weight: 800;
  font-size: calc(var(--cs) * .62);
  line-height: 1;
  color: var(--blue);
  text-shadow: 0 calc(var(--cs) * .04) 0 var(--blue-dark);
}

/* קלף שנמצאה לו התאמה */
.card.matched { cursor: default; }
.card.matched .front {
  background: var(--green-wash);
  border-color: var(--green);
  box-shadow: 0 var(--lift) 0 var(--green-dark);
}
.card.matched .front .name { color: var(--green-dark); }
.card.matched .front .letter { color: var(--green); text-shadow: 0 calc(var(--cs) * .04) 0 var(--green-dark); }
.card.matched .inner { animation: matchPop .5s ease .3s; }
.card.matched .front::after {
  content: "✓";
  position: absolute; top: -2px; left: -2px;
  width: calc(var(--cs) * .24); height: calc(var(--cs) * .24);
  display: grid; place-items: center;
  background: var(--green); color: #fff;
  font-weight: 800; font-size: calc(var(--cs) * .15);
  border-radius: calc(var(--cs) * .16) 0 calc(var(--cs) * .12) 0;
}

@keyframes matchPop {
  0%   { transform: rotateY(180deg) scale(1); }
  40%  { transform: rotateY(180deg) scale(1.1); }
  100% { transform: rotateY(180deg) scale(1); }
}
@keyframes wobble { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* ---------- מסכים גדולים: כותרת ומרווחים נדיבים יותר ---------- */
@media (min-width: 760px) {
  .app { padding: 12px 20px 16px; }
  h1 { display: block; }
  .brand .logo { width: 44px; height: 44px; }
  .level-btn { font-size: 1.05rem; min-height: 46px; }
  .icon-btn { width: 50px; height: 50px; }
  .progress-row { padding: 12px 4px; }
  .progress { height: 16px; }
}
/* מסכים צרים מאוד: רק אייקונים בבורר הרמות */
@media (max-width: 340px) {
  .level-btn .txt { display: none; }
  .level-btn .ico { font-size: 1.4em; }
}

/* ---------- חגיגת סיום ---------- */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(255,255,255,.88);
  display: grid; place-items: center;
  padding: 16px;
  opacity: 0; visibility: hidden;
  transition: opacity .35s, visibility .35s;
}
.overlay.show { opacity: 1; visibility: visible; }

.win-card {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 8px 0 var(--line);
  padding: 24px 24px 28px;
  text-align: center;
  max-width: 420px; width: 100%;
  transform: scale(.6);
  transition: transform .5s cubic-bezier(.3,1.6,.5,1);
}
.overlay.show .win-card { transform: scale(1); }
.win-card .mascot { width: 110px; height: 110px; margin: 0 auto 4px; animation: spin 1.6s linear infinite; }
.win-card h2 { font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 800; color: var(--green); letter-spacing: -0.02em; margin-bottom: 6px; }
.win-card p { font-size: clamp(1.15rem, 4vw, 1.4rem); color: var(--pencil); margin-bottom: 22px; line-height: 1.4; }

.btn-primary {
  width: 100%;
  font: inherit; font-weight: 700; font-size: 1.5rem;
  min-height: 64px;
  color: #fff;
  background: var(--green);
  border: 2px solid var(--green-dark);
  border-radius: 16px;
  box-shadow: 0 5px 0 var(--green-dark);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s;
}
.btn-primary:active { box-shadow: 0 0 0 var(--green-dark); transform: translateY(5px); }

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .inner { transition-duration: .2s; }
  .card.matched .inner, .win-card .mascot, .brand .logo { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span id="logo"></span>
      <h1>משחק זיכרון חנוכה</h1>
    </div>
    <nav class="levels" aria-label="בחירת רמה">
      <button class="level-btn" data-level="classic"  aria-label="רמה קלה – קלפים זהים"><span class="ico">👯</span><span class="txt">זהים</span></button>
      <button class="level-btn" data-level="relation" aria-label="רמת קשר – מה הולך עם מה"><span class="ico">🔗</span><span class="txt">קשר</span></button>
      <button class="level-btn" data-level="letters"  aria-label="רמת אות פותחת"><span class="ico">🔤</span><span class="txt">אות</span></button>
    </nav>
    <button class="icon-btn" id="muteBtn" aria-label="השתקת צליל">🔊</button>
  </header>

  <div class="progress-row" aria-label="זוגות שנמצאו">
    <div class="progress"><div class="fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0/12</div>
  </div>

  <main class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </main>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="win-card">
    <div class="mascot" id="winMascot"></div>
    <h2>כל הכבוד!</h2>
    <p>מצאת את כל הזוגות!<br>חג חנוכה שמח! 🕎</p>
    <button class="btn-primary" id="againBtn">שחק שוב</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* =========================================================
   1. איורים – כל ה-SVG מצוירים כאן (viewBox 0 0 100 100)
   ========================================================= */

/** עוטף תוכן SVG בתגית svg אחידה */
const svg = body => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

/** חנוכייה עם 8 נרות + שמש */
function chanukiahSVG() {
  const xs = [14, 23, 32, 41, 50, 59, 68, 77, 86];
  const colors = ['#ff4b4b', '#ff9600', '#ffc800', '#58cc02', '#fff', '#1cb0f6', '#ce82ff', '#ff86d0', '#2bdbc5'];
  let c = '';
  xs.forEach((x, i) => {
    const top = i === 4 ? 22 : 34, bottom = i === 4 ? 44 : 52; // השמש גבוה יותר
    c += `<rect x="${x - 3}" y="${top}" width="6" height="${bottom - top}" rx="1.5" fill="${colors[i]}" stroke="#4b4b4b" stroke-width="1"/>`;
    c += `<path d="M${x} ${top - 10} C${x + 4} ${top - 5} ${x + 3} ${top - 1} ${x} ${top - 1} C${x - 3} ${top - 1} ${x - 4} ${top - 5} ${x} ${top - 10}Z" fill="#ff9600"/>`;
    c += `<ellipse cx="${x}" cy="${top - 3.5}" rx="1.4" ry="2.4" fill="#ffe680"/>`;
  });
  return svg(`
    <rect x="45" y="44" width="10" height="10" fill="#e0a800"/>
    <rect x="8" y="52" width="84" height="7" rx="3.5" fill="#ffc800" stroke="#c99a00" stroke-width="2"/>
    <rect x="45" y="58" width="10" height="26" fill="#ffc800" stroke="#c99a00" stroke-width="2"/>
    <path d="M30 94 L36 83 H64 L70 94Z" fill="#ffc800" stroke="#c99a00" stroke-width="2" stroke-linejoin="round"/>
    ${c}`);
}

const SEVIVON_SVG = svg(`
  <rect x="44" y="4" width="12" height="24" rx="5" fill="#ff9600" stroke="#c76b00" stroke-width="2.5"/>
  <path d="M22 28 H78 Q84 28 84 34 V58 L50 96 L16 58 V34 Q16 28 22 28Z" fill="#1cb0f6" stroke="#1480b3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 28 H78 Q84 28 84 34 V58 L50 96Z" fill="#1899d6"/>
  <text x="44" y="66" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffc800" font-family="Arial">נ</text>
  <path d="M24 34 V54" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".6"/>`);

/** מאגר כל הסמלים: מזהה → שם ואיור */
const SYMBOLS = {
  sevivon:   { name: 'סביבון', svg: SEVIVON_SVG },
  chanukiah: { name: 'חנוכייה', svg: chanukiahSVG() },

  sufganiya: { name: 'סופגנייה', svg: svg(`
    <ellipse cx="50" cy="60" rx="40" ry="26" fill="#d9822b" stroke="#a65d14" stroke-width="2.5"/>
    <ellipse cx="50" cy="52" rx="35" ry="20" fill="#f4b45f"/>
    <path d="M18 50 Q30 34 50 34 Q72 34 82 50 Q70 44 60 47 Q52 42 44 47 Q32 43 18 50Z" fill="#fff"/>
    <circle cx="30" cy="44" r="2" fill="#fff"/><circle cx="66" cy="40" r="2" fill="#fff"/>
    <circle cx="40" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="57" r="1.6" fill="#fff"/>
    <ellipse cx="50" cy="38" rx="9" ry="6" fill="#ff4b4b" stroke="#d33131" stroke-width="1.5"/>
    <ellipse cx="47" cy="36" rx="3" ry="1.6" fill="#ffa3a3"/>`) },

  ner: { name: 'נר', svg: svg(`
    <circle cx="50" cy="26" r="20" fill="#ffc800" opacity=".2"/>
    <path d="M50 6 C62 20 60 34 50 36 C40 34 38 20 50 6Z" fill="#ff9600"/>
    <path d="M50 16 C56 24 55 32 50 33 C45 32 44 24 50 16Z" fill="#ffe680"/>
    <line x1="50" y1="34" x2="50" y2="40" stroke="#4b4b4b" stroke-width="2"/>
    <rect x="38" y="40" width="24" height="46" rx="4" fill="#1cb0f6" stroke="#1480b3" stroke-width="2.5"/>
    <path d="M38 52 L62 46 M38 64 L62 58 M38 76 L62 70" stroke="#fff" stroke-width="4" opacity=".85"/>
    <ellipse cx="50" cy="90" rx="22" ry="5" fill="#ffc800" stroke="#c99a00" stroke-width="2"/>`) },

  kad: { name: 'כד שמן', svg: svg(`
    <path d="M36 30 Q20 34 24 52" fill="none" stroke="#a65d14" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 30 Q80 34 76 52" fill="none" stroke="#a65d14" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 14 H60 V26 Q76 36 76 60 Q76 86 50 92 Q24 86 24 60 Q24 36 40 26Z" fill="#e0893c" stroke="#a65d14" stroke-width="3" stroke-linejoin="round"/>
    <rect x="37" y="9" width="26" height="7" rx="3" fill="#c9702a" stroke="#a65d14" stroke-width="2.5"/>
    <path d="M30 56 H70 M28 70 H72" stroke="#a65d14" stroke-width="2"/>
    <path d="M50 58 C55 63 55 67 50 68 C45 67 45 63 50 58Z" fill="#ffc800" stroke="#c99a00" stroke-width="1"/>
    <path d="M33 38 Q30 48 31 58" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45" fill="none"/>`) },

  levivah: { name: 'לביבה', svg: svg(`
    <ellipse cx="50" cy="72" rx="44" ry="12" fill="#e5e5e5"/>
    <ellipse cx="50" cy="70" rx="38" ry="9" fill="#fff" stroke="#e5e5e5" stroke-width="2"/>
    <path d="M14 58 Q12 40 30 36 Q40 26 56 30 Q76 28 84 44 Q90 58 74 66 Q60 74 42 70 Q20 70 14 58Z" fill="#e0a43a" stroke="#a66d10" stroke-width="2.5"/>
    <path d="M24 50 L36 46 M42 40 L54 44 M60 38 L72 42 M30 60 L44 56 M52 56 L66 60 M70 52 L80 50 M38 50 L48 52" stroke="#8a5409" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 44 L32 41 M64 50 L70 47" stroke="#ffe08a" stroke-width="2.5" stroke-linecap="round"/>`) },

  matbea: { name: 'מטבע', svg: svg(`
    <circle cx="50" cy="55" r="38" fill="#c99a00"/>
    <circle cx="50" cy="50" r="38" fill="#ffc800" stroke="#c99a00" stroke-width="3"/>
    <circle cx="50" cy="50" r="29" fill="none" stroke="#e0a800" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M50 30 L67 60 H33Z M50 70 L33 40 H67Z" fill="none" stroke="#a17a00" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M26 36 Q32 24 44 20" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6" fill="none"/>`) },

  matana: { name: 'מתנה', svg: svg(`
    <rect x="16" y="42" width="68" height="48" rx="5" fill="#ce82ff" stroke="#9a4fd1" stroke-width="3"/>
    <rect x="12" y="32" width="76" height="14" rx="4" fill="#dca6ff" stroke="#9a4fd1" stroke-width="3"/>

/* =========================================================
   3. צלילים – Web Audio API (ללא קבצים חיצוניים)
   ========================================================= */
const Sound = {
  ctx: null,
  muted: false,

  /** יצירת/הפעלת ההקשר הקולי – רק אחרי פעולת משתמש */
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },

  /** צליל בודד עם מעטפת עדינה */
  tone(freq, start = 0, dur = 0.2, type = 'sine', vol = 0.2, slideTo = null) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime + start;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  },

  flip()  { this.tone(520, 0, 0.12, 'sine', 0.15, 780); },
  match() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * 0.09, 0.25, 'triangle', 0.18)); },
  win() {
    const melody = [523, 523, 659, 784, 659, 784, 1047, 1047];
    const times  = [0, .15, .3, .45, .7, .85, 1.0, 1.25];
    melody.forEach((f, i) => this.tone(f, times[i], i === 7 ? 0.7 : 0.22, 'triangle', 0.2));
    [262, 330, 392].forEach(f => this.tone(f, 1.25, 0.8, 'sine', 0.08));
    for (let i = 0; i < 10; i++) this.tone(1500 + Math.random() * 1500, 1.4 + i * 0.07, 0.15, 'sine', 0.05);
  }
};

/* =========================================================
   4. אחסון העדפות (בטוח גם כשאין localStorage)
   ========================================================= */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* לא נורא */ }
}

/* =========================================================
   5. לוגיקת המשחק
   ========================================================= */
const PAIRS = 12;
const boardEl   = document.getElementById('board');
const boardWrap = document.getElementById('boardWrap');
const fillEl    = document.getElementById('progressFill');
const countEl   = document.getElementById('progressCount');
const overlayEl = document.getElementById('overlay');
const muteBtn   = document.getElementById('muteBtn');

// הסביבון הוא ה"דמות" של המשחק
document.getElementById('logo').innerHTML = SEVIVON_SVG.replace('<svg', '<svg class="logo"');
document.getElementById('winMascot').innerHTML = SEVIVON_SVG;

const state = {
  level: load('hanukkah-level', 'classic'),
  first: null,   // הקלף הראשון שנפתח בתור
  lock: false,   // נעילה בזמן בדיקת זוג
  matched: 0
};
if (!LEVELS[state.level]) state.level = 'classic';

/** ערבוב Fisher–Yates */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * בונה את חפיסת הקלפים לפי הרמה.
 * כל קלף: { pair: מזהה הזוג, type: 'pic' | 'letter', id, hideName }
 */
function buildDeck(level) {
  const deck = [];
  if (level === 'classic') {
    LEVELS.classic.forEach(id => deck.push({ pair: id, type: 'pic', id }, { pair: id, type: 'pic', id }));
  } else if (level === 'relation') {
    LEVELS.relation.forEach(([a, b], i) => deck.push({ pair: i, type: 'pic', id: a }, { pair: i, type: 'pic', id: b }));
  } else {
    LEVELS.letters.forEach(id => deck.push(
      { pair: id, type: 'pic', id, hideName: true },
      { pair: id, type: 'letter', id }
    ));
  }
  return shuffle(deck);
}

/** HTML של שם הסמל, עם האות הראשונה מודגשת בצבע */
function nameHTML(name) {
  return `<span class="first">${name[0]}</span>${name.slice(1)}`;
}

/** תוכן הצד הקדמי של קלף */
function frontHTML(card) {
  const sym = SYMBOLS[card.id];
  if (card.type === 'letter') {
    return `<div class="letter">${sym.name[0]}</div>`;
  }
  const cls = ['name'];
  if (sym.name.length > 8) cls.push('long');
  if (card.hideName) cls.push('hide-until-match');
  const label = card.hideName ? nameHTML(sym.name) : sym.name;
  return `<div class="art">${sym.svg}</div><div class="${cls.join(' ')}">${label}</div>`;
}

/** התחלת משחק חדש */
function newGame() {
  hideWin();
  state.first = null;
  state.lock = false;
  state.matched = 0;

  boardEl.innerHTML = '';
  buildDeck(state.level).forEach(card => {
    const el = document.createElement('button');
    el.className = 'card';
    el.dataset.pair = card.pair;
    el.setAttribute('aria-label', 'קלף סגור');
    el.innerHTML = `
      <div class="inner">
        <div class="face back">${BACK_SVG}</div>
        <div class="face front">${frontHTML(card)}</div>
      </div>`;
    const label = card.type === 'letter' ? 'האות ' + SYMBOLS[card.id].name[0] : SYMBOLS[card.id].name;
    el.addEventListener('click', () => onCardClick(el, label));
    boardEl.appendChild(el);
  });

  document.querySelectorAll('.level-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.level === state.level));

  renderProgress();
  layoutBoard();
}

/** טיפול בלחיצה על קלף */
function onCardClick(card, label) {
  Sound.unlock();
  if (state.lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');
  card.setAttribute('aria-label', label);
  Sound.flip();

  if (!state.first) { state.first = card; return; }

  const a = state.first, b = card;
  state.first = null;

  if (a.dataset.pair === b.dataset.pair) {
    // התאמה! 🎉
    setTimeout(() => {
      [a, b].forEach(c => { c.classList.remove('flipped'); c.classList.add('matched'); });
      Sound.match();
      state.matched++;
      renderProgress();
      if (state.matched === PAIRS) setTimeout(showWin, 900);
    }, 350);
  } else {
    // לא תואם – מחכים שנייה ומהפכים בעדינות בחזרה, בלי שום "עונש"
    state.lock = true;
    setTimeout(() => {
      [a, b].forEach(c => { c.classList.remove('flipped'); c.setAttribute('aria-label', 'קלף סגור'); });
      state.lock = false;
    }, 1100);
  }
}

/** פס התקדמות ירוק */
function renderProgress() {
  fillEl.style.width = (state.matched / PAIRS) * 100 + '%';
  countEl.textContent = `${state.matched}/${PAIRS}`;
}

/**
 * פריסת הלוח: בודקת כל חלוקה אפשרית לשורות ועמודות (רשת מלאה בלבד),
 * ובוחרת את זו שנותנת לקלף את השטח הגדול ביותר.
 * יחס הגובה/רוחב של הקלף גמיש (0.85–1.45) כדי לנצל את כל המסך.
 */
function layoutBoard() {
  const n = PAIRS * 2;
  const W = boardWrap.clientWidth;
  const H = boardWrap.clientHeight;
  if (!W || !H) return; // הדף עוד לא נפרס – ResizeObserver יקרא שוב

  const gap = W < 500 ? 6 : W < 900 ? 10 : 14;
  const MIN_RATIO = 0.85, MAX_RATIO = 1.45; // גובה ÷ רוחב

  let best = null;
  for (let cols = 2; cols <= n; cols++) {
    if (n % cols) continue;
    const rows = n / cols;
    let w = (W - gap * (cols - 1)) / cols;
    let h = (H - gap * (rows - 1)) / rows;
    if (h > w * MAX_RATIO) h = w * MAX_RATIO;   // לא צר וגבוה מדי
    if (w > h / MIN_RATIO) w = h / MIN_RATIO;   // לא רחב ושטוח מדי
    const area = w * h;
    if (!best || area > best.area) best = { cols, w, h, area };
  }

  // גבול עליון סביר למסכים ענקיים
  const scale = Math.min(1, 220 / best.w, 260 / best.h);
  const cw = Math.floor(best.w * scale);
  const ch = Math.floor(best.h * scale);
  const cs = Math.min(cw, ch);

  const s = boardEl.style;
  s.setProperty('--gap', gap + 'px');
  s.setProperty('--cw', cw + 'px');
  s.setProperty('--ch', ch + 'px');
  s.setProperty('--cs', cs + 'px');
  s.setProperty('--lift', Math.max(3, Math.round(cs * 0.05)) + 'px');
  s.gridTemplateColumns = `repeat(${best.cols}, ${cw}px)`;
}

/* =========================================================
   6. חגיגת סיום – קונפטי של סביבונים, כוכבים ומטבעות
   ========================================================= */
const canvas = document.getElementById('confetti');
const ctx2d = canvas.getContext('2d');
let confettiRAF = null;

function showWin() {
  overlayEl.classList.add('show');
  Sound.win();
  startConfetti();
  setTimeout(() => document.getElementById('againBtn').focus(), 500);
}
function hideWin() {
  overlayEl.classList.remove('show');
  stopConfetti();
}

function startConfetti() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);

  const colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ff86d0', '#ce82ff', '#ff9600'];
  const kinds = ['star', 'coin', 'dreidel', 'rect'];
  const parts = Array.from({ length: 140 }, () => ({
    x: Math.random() * innerWidth,
    y: -20 - Math.random() * innerHeight,
    s: 8 + Math.random() * 12,
    vy: 1.5 + Math.random() * 2.5,
    vx: -1 + Math.random() * 2,
    rot: Math.random() * Math.PI * 2,
    vr: -0.1 + Math.random() * 0.2,
    color: colors[Math.floor(Math.random() * colors.length)],
    kind: kinds[Math.floor(Math.random() * kinds.length)]
  }));

  const startTime = performance.now();
  const DURATION = 6000;

  function frame(now) {
    const elapsed = now - startTime;
    ctx2d.clearRect(0, 0, innerWidth, innerHeight);
    ctx2d.globalAlpha = elapsed > DURATION - 1000 ? Math.max(0, (DURATION - elapsed) / 1000) : 1;
    parts.forEach(p => {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y / 30) * 0.5; p.rot += p.vr;
      if (p.y > innerHeight + 20 && elapsed < DURATION - 1500) { p.y = -20; p.x = Math.random() * innerWidth; }
      drawPiece(p);
    });
    if (elapsed < DURATION) confettiRAF = requestAnimationFrame(frame);
    else stopConfetti();
  }
  stopConfetti();
  confettiRAF = requestAnimationFrame(frame);
}

function stopConfetti() {
  if (confettiRAF) cancelAnimationFrame(confettiRAF);
  confettiRAF = null;
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

/** ציור חלקיק קונפטי בודד */
function drawPiece(p) {
  const c = ctx2d, s = p.s;
  c.save();
  c.translate(p.x, p.y);
  c.rotate(p.rot);
  c.fillStyle = p.color;
  c.beginPath();
  if (p.kind === 'star') {
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? s * 0.4 : s;
      const a = (i * Math.PI) / 5 - Math.PI / 2;
      c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath(); c.fill();
  } else if (p.kind === 'coin') {
    c.fillStyle = '#ffc800';
    c.arc(0, 0, s * 0.7, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#c99a00'; c.lineWidth = 2; c.stroke();
  } else if (p.kind === 'dreidel') {
    c.fillRect(-1.5, -s, 3, s * 0.5);
    c.moveTo(-s * 0.6, -s * 0.5); c.lineTo(s * 0.6, -s * 0.5);
    c.lineTo(s * 0.6, s * 0.2); c.lineTo(0, s); c.lineTo(-s * 0.6, s * 0.2);
    c.closePath(); c.fill();
  } else {
    c.fillRect(-s / 2, -s / 4, s, s / 2);
  }
  c.restore();
}

/* =========================================================
   7. חיבור כפתורים ואירועים
   ========================================================= */
function setMuted(m) {
  Sound.muted = m;
  muteBtn.textContent = m ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', m ? 'הפעלת צליל' : 'השתקת צליל');
  save('hanukkah-muted', m);
}
setMuted(load('hanukkah-muted', false));

muteBtn.addEventListener('click', () => { Sound.unlock(); setMuted(!Sound.muted); if (!Sound.muted) Sound.flip(); });

document.querySelectorAll('.level-btn').forEach(btn =>
  btn.addEventListener('click', () => {
    Sound.unlock();
    state.level = btn.dataset.level;
    save('hanukkah-level', state.level);
    newGame();
  }));

document.getElementById('againBtn').addEventListener('click', () => { Sound.unlock(); newGame(); });

// פריסה מחדש בכל שינוי גודל של אזור הלוח (טעינה, סיבוב מסך, שינוי חלון)
if ('ResizeObserver' in window) {
  new ResizeObserver(() => layoutBoard()).observe(boardWrap);
} else {
  window.addEventListener('resize', layoutBoard);
}
window.addEventListener('load', layoutBoard);
window.addEventListener('orientationchange', () => setTimeout(layoutBoard, 300));

newGame();

/* =========================================================
   8. Service Worker – עבודה בלי אינטרנט
   נרשם רק כשהדף מוגש מ-http/https (למשל GitHub Pages).
   בפתיחה מקומית (file://) או בדפדפן שלא תומך – פשוט מדלגים.
   ========================================================= */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      /* לא נורא – המשחק עובד גם בלי מצב אופליין */
    });
  });
}
